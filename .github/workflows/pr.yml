name: PR

on:
  pull_request:
    branches: [wsol-adaptor]

jobs:
  format_and_lint_programs:
    name: Format & Lint Programs
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'programs/') || contains(github.event.pull_request.changed_files, 'clients/py')
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          clippy: true
          rustfmt: true

      - name: Format Programs
        run: pnpm programs:format

      - name: Lint Programs
        run: pnpm programs:lint

  format_and_lint_client_js:
    name: Format & Lint Client JS
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'clients/js-legacy/')
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Format Client JS
        run: pnpm clients:js:format

      - name: Lint Client JS
        run: pnpm clients:js:lint

  format_and_lint_cli:
    name: Format & Lint CLI
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'clients/cli/')
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          clippy: true
          rustfmt: true
          cli: true

      - name: Format
        run: pnpm clients:cli:format

      - name: Lint
        run: pnpm clients:cli:lint

  audit_rust:
    name: Audit Rust
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: cargo-audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: pnpm rust:audit

  spellcheck_rust:
    name: Spellcheck Rust
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: cargo-spellcheck

      - name: Install cargo-spellcheck
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-spellcheck

      - name: Run cargo-spellcheck
        run: pnpm rust:spellcheck

  build_programs:
    name: Build programs
    runs-on: ubuntu-latest
    needs: format_and_lint_programs
    if: contains(github.event.pull_request.changed_files, 'programs/')
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: cargo-programs
          solana: true

      - name: Build Programs
        run: pnpm programs:build

      - name: Upload Program Builds
        uses: actions/upload-artifact@v4
        with:
          name: program-builds
          path: ./target/deploy/*.so
          if-no-files-found: error

      - name: Save Program Builds For Client Jobs
        uses: actions/cache/save@v4
        with:
          path: ./**/*.so
          key: ${{ runner.os }}-builds-${{ github.sha }}

  test_programs:
    name: Test Programs
    runs-on: ubuntu-latest
    needs: format_and_lint_programs
    if: contains(github.event.pull_request.changed_files, 'programs/')
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: cargo-program-tests
          cargo-cache-fallback-key: cargo-programs
          solana: true
          purge: true

      - name: Test Programs
        run: pnpm programs:test

  test_client_js:
    name: Test Client JS
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'clients/js-legacy/')
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          solana: true

      - name: Test Client JS
        run: pnpm clients:js:test

  test_client_cli:
    name: Test Client CLI
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, 'clients/cli/')
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: cargo-cli
          solana: true
          cli: true

      - name: Test
        run: pnpm clients:cli:test

  test_client_py:
    name: Test Client Python
    runs-on: ubuntu-latest
    needs: build_programs
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          solana: true

      - name: Restore Program Builds
        uses: actions/cache/restore@v4
        with:
          path: ./**/*.so
          key: ${{ runner.os }}-builds-${{ github.sha }}

      - name: Test Client Python
        run: pnpm clients:py:test

  upgrade_devnet_program:
    name: Update our devnet stake pool program
    runs-on: ubuntu-latest
    needs: test_client_py
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          solana: true

      - name: Restore Program Builds
        uses: actions/cache/restore@v4
        with:
          path: ./**/*.so
          key: ${{ runner.os }}-builds-${{ github.sha }}

      - name: Update devnet program
        env:
          FOGO_TESTNET_RPC: ${{ vars.FOGO_TESTNET_RPC }}
          FOGO_DEVNET_PROGRAM_ID_KEYPAIR: ${{ secrets.FOGO_DEVNET_PROGRAM_ID_KEYPAIR }}
          FOGO_DEVNET_FEE_PAYER_KEYPAIR: ${{ secrets.FOGO_DEVNET_FEE_PAYER_KEYPAIR }}
        run: |
          set -euo pipefail

          PROGRAM_SO="./target/deploy/spl_stake_pool.so"
          if [ ! -f "$PROGRAM_SO" ]; then
            echo "Program binary not found at $PROGRAM_SO" >&2
            exit 1
          fi

          umask 177
          PROGRAM_ID_KEYPAIR="$(mktemp)"
          trap 'rm -f "$PROGRAM_ID_KEYPAIR"' EXIT

          FEE_PAYER_KEYPAIR="$(mktemp)"
          trap 'rm -f "$FEE_PAYER_KEYPAIR"' EXIT

          printf '%s' "$FOGO_DEVNET_PROGRAM_ID_KEYPAIR" > "$PROGRAM_ID_KEYPAIR"
          printf '%s' "$FOGO_DEVNET_FEE_PAYER_KEYPAIR" > "$FEE_PAYER_KEYPAIR"

          solana program deploy "$PROGRAM_SO" \
            --program-id "$PROGRAM_ID_KEYPAIR" \
            --url "$FOGO_TESTNET_RPC" \
            --keypair "$FEE_PAYER_KEYPAIR"
